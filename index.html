<!doctype html>
<!--
  File:     index.html
  Role:     HTML entry point of the single page application
  Author:   Adrien Duclaud

-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0B" />
    <meta
      name="description"
      content="Outil de fan non officiel pour créer et suivre ses bandes de Black Death City."
    />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/old-celtiberian.woff2" as="font" type="font/woff2" crossorigin />
    <title>BDC Warband Manager</title>
  </head>
  <body>
    <div id="root">
      <!-- Static shell painted before the JavaScript runs; React replaces it on first render. -->
      <div class="flex h-dvh flex-col overflow-hidden">
        <header class="no-print shrink-0 border-b-2 border-rule">
          <div
            class="mx-auto flex max-w-[120rem] items-center gap-3 px-4 py-2 sm:gap-4 sm:px-6 sm:py-3 xl:px-10"
          >
            <img src="/images/logo.webp" alt="" width="56" height="63" class="h-10 w-auto sm:h-14" />
            <div class="min-w-0 flex-1">
              <span class="block font-gothic text-2xl leading-none sm:text-3xl">Black Death City</span>
              <p id="shell-tagline" class="truncate font-hand text-base text-on-page-muted sm:text-lg">
                Création de bandes et suivi de campagne
              </p>
            </div>
            <div class="h-11 w-[5.75rem]"></div>
          </div>
        </header>
        <main class="flex-1"></main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
