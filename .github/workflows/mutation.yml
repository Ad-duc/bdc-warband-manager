# File:     .github/workflows/mutation.yml
# Role:     Mutation testing of the rules engine with Stryker, every Monday
#           and on demand. Too slow for every push (about twenty minutes), it
#           fails below a score of 80 and keeps the HTML report as an artifact.
# Author:   Adrien Duclaud
# Created:  2026-10-17
# License:  MIT

name: Mutation testing

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30
